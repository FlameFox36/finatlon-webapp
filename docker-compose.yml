services:
  postgres:
    image: postgres:alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT}:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
      cache_from:
        - type=gha
      cache_to:
        - type=gha,mode=max
    restart: always
    depends_on:
      - migrations
    environment:
      DATABASE_URL: Host=postgres;Port=${POSTGRES_PORT};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "${BACKEND_PORT}:8000"

  migrations:
    build:
      context: ./backend
      dockerfile: Dockerfile.migrations
      cache_from:
        - type=gha
      cache_to:
        - type=gha,mode=max
    environment:
      DATABASE_URL: Host=postgres;Port=${POSTGRES_PORT};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    restart: always
    ports:
      - "${FRONTEND_PORT}:80"

volumes:
  db_data: